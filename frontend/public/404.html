<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chesstíse</title>
  <script>
    // GitHub Pages SPA redirect: encode the path into a query string
    // so the main index.html can restore it with history.replaceState.
    var l = window.location;
    var base = '/chesstise/';
    var path = l.pathname.slice(base.length);
    l.replace(
      l.protocol + '//' + l.host + base + '?/' + path +
      (l.search ? '&' + l.search.slice(1) : '') + l.hash
    );
  </script>
</head>
<body></body>
</html>
